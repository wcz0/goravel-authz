name: CI

on:
  push:
    branches:
      - main
      - goravel-1.15
      - goravel-1.16
      - goravel-1.17
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The toolchain declared by go.mod is the oldest Go version the release
      # line supports, so testing it catches features that are too new for the
      # users of that line.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -cover ./...

  release-line:
    name: Release line matches Goravel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Every release line must depend on the Goravel version it is named after,
      # and the sqlite driver, when used, must target the same framework line.
      # The v1.15 line has no sqlite driver: the official one requires 1.16.
      - name: Check the framework line
        run: |
          framework="$(go list -m -f '{{.Version}}' github.com/goravel/framework)"

          sqlite_dir="$(go mod download -json github.com/goravel/sqlite 2>/dev/null | grep -o '"Dir": *"[^"]*"' | sed 's/.*: *"//; s/"$//')"
          if [ -n "$sqlite_dir" ] && [ -f "$sqlite_dir/go.mod" ]; then
            sqlite_framework="$(awk '$1 == "github.com/goravel/framework" {print $2}' "$sqlite_dir/go.mod" | head -n1)"
            if [ -n "$sqlite_framework" ] && [ "${framework%.*}" != "${sqlite_framework%.*}" ]; then
              echo "::error::goravel/sqlite targets $sqlite_framework, which does not match goravel/framework $framework"
              exit 1
            fi
            echo "ok: goravel/sqlite targets $sqlite_framework"
          fi

          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$branch" in
            goravel-1.*)
              expected="v${branch#goravel-}"
              case "$framework" in
                "$expected".*) echo "ok: $branch uses framework $framework" ;;
                *)
                  echo "::error::$branch must depend on goravel/framework ${expected}.x, found $framework"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "ok: $branch uses framework $framework"
              ;;
          esac
